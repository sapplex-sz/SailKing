name: Windows input method
on:
  push:
    branches: [main, 'codex/windows-support']
    paths: ['windows/**', 'Runtime/src/**', 'Runtime/include/**', 'Vendor/RimeData/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'Runtime/src/**', 'Runtime/include/**', 'Vendor/RimeData/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify native COM components
        shell: pwsh
        run: |
          $build = "build/native/${{ matrix.arch }}"
          cmake -S windows -B $build -A '${{ matrix.arch }}' -DSAILKING_BROKER=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native configure failed' }
          cmake --build $build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          ctest --test-dir $build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
          $register = if ('${{ matrix.arch }}' -eq 'x64') { "$env:SystemRoot/System32/regsvr32.exe" } else { "$env:SystemRoot/SysWOW64/regsvr32.exe" }
          $dll = (Resolve-Path "$build/Release/SailKingTip.dll").Path
          & $register /s $dll | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Native registration failed' }
          try {
            & "$build/Release/SailKingProbe.exe" --self-test
            if ($LASTEXITCODE -ne 0) { throw 'Native class verification failed' }
          } finally { & $register /s /u $dll | Out-Host }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SailKing-native-${{ matrix.arch }}
          path: |
            build/native/${{ matrix.arch }}/Release/SailKingTip.dll
            build/native/${{ matrix.arch }}/Release/SailKingProbe.exe
          if-no-files-found: ignore
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/SailKingBuildCache
          key: windows-dependencies-rime117-llama1e411-v1
      - name: Build native input method, app and installer
        shell: pwsh
        run: ./windows/scripts/build.ps1 -TestComPreflight
      - name: Install and verify both COM registrations
        shell: pwsh
        run: |
          $installer = Resolve-Path 'build/windows/SailKing-0.4.0-preview.1-Windows-x64.exe'
          $p = Start-Process $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $root = "$env:ProgramFiles/SailKing"
          & "$root/SailKingProbe.exe" --profiles
          if ($LASTEXITCODE -ne 0) { throw 'Profile registration failed' }
          & "$root/SailKingProbe.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'x64 COM activation failed' }
          & "$root/native/0.4.0-preview.1/x86/SailKingProbe.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'x86 COM activation failed' }
      - name: Render Windows app component preview
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles/SailKing/SailKing.exe"
          $p = Start-Process $exe -ArgumentList "--render-preview `"$pwd/build/windows/windows-workspace-preview.png`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path 'build/windows/windows-workspace-preview.png')) { throw 'WPF render failed' }
      - name: Uninstall without deleting user dictionaries or models
        shell: pwsh
        run: |
          $p = Start-Process "$env:ProgramFiles/SailKing/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path 'HKLM:/SOFTWARE/Classes/CLSID/{536B7ED5-A481-4931-A19E-4706E2BE6862}') { throw 'x64 COM registration remained' }
          if (Test-Path 'HKLM:/SOFTWARE/Classes/Wow6432Node/CLSID/{536B7ED5-A481-4931-A19E-4706E2BE6862}') { throw 'x86 COM registration remained' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SailKing-Windows-preview
          path: |
            build/windows/SailKing-*.exe
            build/windows/SHA256SUMS.txt
            build/windows/windows-workspace-preview.png
            install.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: SailKing-Windows-development-staging
          path: |
            build/windows/stage
            build/windows/x64/Release/SailKingTip.dll
            build/windows/x64/Release/SailKingProbe.exe
            build/windows/Win32/Release/SailKingTip.dll
            build/windows/Win32/Release/SailKingProbe.exe
          if-no-files-found: ignore
